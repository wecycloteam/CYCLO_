# Render Blueprint for the CYCLO API. In the Render dashboard: New + -> Blueprint,
# connect this repo, and Render reads this file to configure the service automatically.
# Secrets (marked sync: false) must still be pasted in manually in Render's dashboard —
# they are never committed to git.
services:
  - type: web
    name: cyclo-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=apps/api
    startCommand: node apps/api/dist/main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: "30"
      - key: WEB_ORIGIN
        sync: false
      - key: PORT
        value: "3000"
