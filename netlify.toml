# Netlify config for CYCLO — both the Next.js web app AND the NestJS API are hosted here
# (no Render/other backend host). Lives at the repo root so it's read regardless of
# whatever "Base directory" is set to in the Netlify dashboard.
#
# `base` is deliberately NOT set here — this site's dashboard already has monorepo
# detection configured with package_path=apps/web (set when the site was first connected).
# Declaring `base = "apps/web"` here too made Netlify apply it twice, doubling the resolved
# publish path to apps/web/apps/web/.next and breaking the @netlify/plugin-nextjs build.
# The dashboard setting alone already scopes the working directory to apps/web.
[build]
  # Builds the web app (for the site itself) and the API (so its compiled dist/ exists
  # before Netlify bundles netlify/functions/api.ts, which requires that compiled output).
  # `prisma generate` runs explicitly, right after install, rather than relying on
  # @prisma/client's own postinstall hook to pick up schema.prisma — that implicit path
  # silently generated a *stale* client on Netlify at least once (missing User.username/
  # googleId columns added straight to schema.prisma), failing apps/api's `nest build`
  # with "Object literal may only specify known properties" even though the exact same
  # schema change had already been regenerated and verified working locally.
  # `npm ci` (not `npm install`) because Netlify caches node_modules between builds, and
  # the trailing prune below deletes files from inside it — including one `prisma
  # generate` itself needs at build time (a wasm loader matched by the `*wasm*` glob).
  # `npm install` on a cached, already-pruned node_modules just leaves those files
  # missing (nothing to "update"), so the *next* build's `prisma generate` failed with
  # "Cannot find module .../query_engine_bg.postgresql.wasm-base64.js" — a build
  # poisoning its own successor. `npm ci` always wipes node_modules and reinstalls from
  # package-lock.json first, so no build can inherit a previous build's pruning.
  # The trailing prune removes files Netlify's function packager would otherwise ship
  # verbatim: @prisma/client's npm package bundles wasm query-engine variants for every
  # database Prisma supports (MySQL, SQLite, SQL Server, CockroachDB — this app only uses
  # Postgres with the default native binary engine, never those wasm ones), and .prisma/client
  # carries every platform's native engine binary though only the Linux one runs here. Left
  # in, these blew the packaged function past Netlify's 50MB compressed function limit.
  # Also prunes @prisma/client's generator-build (schema-generation tooling, only used by
  # the `prisma generate` CLI, never at runtime) — Netlify's function packager traces
  # requires even inside externalized packages, found generator-build's own `require('typescript')`,
  # and pulled in the entire 15MB+ TypeScript compiler package for code that's never reachable
  # from an actual API request.
  command = "cd ../.. && npm ci && npx prisma generate --schema=prisma/schema.prisma && npm run build --workspace=apps/web && npm run build --workspace=apps/api && rm -f node_modules/@prisma/client/runtime/*wasm* node_modules/@prisma/client/runtime/*.map node_modules/.prisma/client/*.wasm node_modules/.prisma/client/query_engine-windows.dll.node && rm -rf node_modules/@prisma/client/generator-build node_modules/typescript"
  # Without this, @netlify/plugin-nextjs falls back to a framework-detected default that
  # gets joined against the dashboard's monorepo package_path (apps/web) a second time,
  # doubling to apps/web/apps/web/.next and failing with "publish directory not found".
  # Declaring it explicitly (relative to the effective apps/web base) fixes that.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Netlify sets NODE_ENV=production during builds, which makes `npm install` skip
  # devDependencies — but the build needs several (typescript, @nestjs/cli, ts-loader) to
  # even compile. Without this the build fails with "exit code 2" before anything runs.
  NPM_FLAGS = "--include=dev"
  # Netlify injects every site env var (not just NEXT_PUBLIC_* ones) into both the web and
  # API build steps, since they share one `npm install && ... build` command. The web build
  # never reads these backend-only secrets (only apps/api's ConfigService does), but
  # Next.js/Turbopack's build cache snapshots process.env internally for cache-key
  # purposes, which puts the raw value inside a .next/cache/turbopack/*.sst file —
  # Netlify's secret scanner then (correctly, mechanically) flags that file and fails the
  # build. Omitting these keys from scanning is safe specifically because they're never in
  # the actual shipped bundle, only an internal build-cache artifact. Add any future
  # backend-only secret here too, or every Gemini/Google-key-shaped addition will fail the
  # build the same way.
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_CLIENT_SECRET,GEMINI_API_KEY,NEXT_SMS_API_TOKEN,JWT_ACCESS_SECRET,DATABASE_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# `functions`/`included_files` paths are relative to `base` (apps/web), so "../.." reaches
# the repo root from there.
[functions]
  directory = "../../netlify/functions"
  node_bundler = "esbuild"
  # Prisma's query engine is a native binary, not JS — bundling it would corrupt it, so it's
  # left external and shipped as-is via included_files instead (needs the
  # rhel-openssl-3.0.x binaryTarget in prisma/schema.prisma, which is what generates this
  # file's Linux/Lambda-compatible engine).
  # @nestjs/core lazily requires @nestjs/websockets and @nestjs/microservices to support
  # those optional features — neither is installed since this app uses neither, but esbuild
  # still tries to statically resolve them and fails, falling back to a slower bundler.
  # Nest's own lazy-require already handles them being absent at runtime; marking them
  # external here just stops esbuild from trying to resolve them at bundle time.
  #
  # @prisma/client and .prisma/client are both external (raw-copied, not bundled) per
  # Prisma's own serverless guidance — esbuild can corrupt native binary loading if it
  # tries to bundle them. The build.command prune step above already stripped the unused
  # wasm/other-platform files from node_modules before this copy happens, so the raw copy
  # ships only what's actually needed.
  external_node_modules = ["@prisma/client", ".prisma/client", "@nestjs/websockets", "@nestjs/microservices"]
  included_files = [
    "../../node_modules/.prisma/client/schema.prisma",
    "../../node_modules/.prisma/client/*.so.node",
  ]

# The web app calls the API at NEXT_PUBLIC_API_URL + path (e.g. "/auth/otp/request"). Set
# NEXT_PUBLIC_API_URL=/api in the Netlify dashboard's site environment variables (build-time
# var, so it must live there, not just in apps/web/.env.local) so requests hit this redirect.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
